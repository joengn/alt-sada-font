# Publishes AltSADATrial.zip as a GitHub Release whenever it changes on main.
# The release number is the ZIP's own version: the folder name inside it (AltSADATrial-1.005/ → v1.005),
# falling back to VERSION. A new version makes a new release; a rebuild with the same version replaces
# the file on that release (and keeps it marked Latest). The ZIP is published exactly as it was built.
name: Release font

on:
  push:
    branches: [main]
    paths: ["AltSADATrial.zip", "VERSION"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        run: |
          ver=$(unzip -Z1 AltSADATrial.zip | head -1 | grep -oE '[0-9]+\.[0-9]+' | head -1 || true)
          [ -n "$ver" ] || ver=$(tr -d '[:space:]' < VERSION)
          [ -n "$ver" ] || { echo "No version found"; exit 1; }
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "Version: $ver"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.v.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" AltSADATrial.zip --clobber
            gh release edit "$TAG" --latest
            echo "Replaced the ZIP on $TAG"
          else
            gh release create "$TAG" AltSADATrial.zip \
              --target "$GITHUB_SHA" \
              --title "Alt SADA Trial $TAG" \
              --notes "Sa Đà typeface, trial $TAG. Download: https://fonts.studioalt.work/sada/" \
              --latest
            echo "Created $TAG"
          fi
